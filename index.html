---
layout: default
---
<ul class="feed-list">
  {% for post in site.posts %}
    <li class="feed-card">
      <time class="feed-date" datetime="{{ post.date | date_to_xmlschema }}">
        {{ post.date | date: "%d.%m.%Y" }}
      </time>
      <h2 class="feed-title">
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      </h2>
      {% if post.excerpt %}
        <p class="feed-excerpt">{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
      {% endif %}
    </li>
  {% endfor %}
</ul>
