backend:
  name: github
  repo: mudaczok/mudaczok.github.io
  branch: main

slug:
  encoding: "ascii"
  clean_accents: true

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "posts"
    label: "Посты"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Шаблон", name: "layout", widget: "hidden", default: "post" }
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Дата", name: "date", widget: "datetime" }
      - { label: "Текст", name: "body", widget: "markdown" }
