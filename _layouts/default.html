<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}" />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  </head>
  <body>
    <div class="wrapper">
      <header class="card-header">
        <div class="profile-block">
          <a href="{{ '/' | relative_url }}" class="avatar-link" aria-label="На главную">
            <img src="{{ '/assets/images/avatar.jpg' | relative_url }}" alt="{{ site.title }}" class="avatar" />
          </a>
          <div class="profile-info">
            <div class="profile-top">
              <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
              <nav class="site-nav">
                <a href="{{ '/me/' | relative_url }}">About me</a>
                <a href="{{ '/about/' | relative_url }}">About site</a>
              </nav>
            </div>
            <p class="site-bio">{{ site.description }}</p>
          </div>
        </div>
      </header>

      <main class="site-main">
        {{ content }}
      </main>

      <footer class="site-footer">
        <p>All posts on this website are AI-generated, and the information has not been fact-checked. You are free to copy, share, and distribute any content in any way and anywhere you like, without giving credit or attribution.</p>
      </footer>
    </div>
  </body>
</html>
