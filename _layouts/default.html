<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}" />
    <script>
      (function () {
        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = saved || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
  </head>
  <body>
    <div class="wrapper">
      <header class="card-header">
        <div class="profile-block">
          <a href="{{ '/' | relative_url }}" class="avatar-link" aria-label="Home">
            <img src="{{ '/assets/images/avatar.jpg' | relative_url }}" alt="{{ site.title }}" class="avatar" />
          </a>
          <div class="profile-info">
            <div class="profile-top">
              <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
              <nav class="site-nav">
                <a href="{{ '/me/' | relative_url }}">About me</a>
                <a href="{{ '/about/' | relative_url }}">About site</a>
                <button type="button" id="search-toggle" class="icon-btn" aria-label="Search" title="Search">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.3-4.3"></path>
                  </svg>
                </button>
                <button type="button" id="theme-toggle" class="icon-btn theme-btn" aria-label="Switch theme" title="Switch theme">
                  <span class="icon-sun" aria-hidden="true">☀</span>
                  <span class="icon-moon" aria-hidden="true">☾</span>
                </button>
              </nav>
            </div>
            <p class="site-bio">{{ site.description }}</p>
          </div>
        </div>

        <div class="header-search" id="header-search" hidden>
          <div class="search-box">
            <input type="search" id="search-input" placeholder="Search posts and tags..." autocomplete="off" aria-label="Search posts" />
            <button type="button" id="search-clear" class="search-clear" hidden aria-label="Clear search">✕</button>
          </div>
          <div id="search-dropdown" class="search-dropdown" hidden></div>
        </div>
      </header>

      <main class="site-main">
        {{ content }}
      </main>

      <footer class="site-footer">
        <p>All posts on this website are AI-generated, and the information has not been fact-checked. You are free to copy, share, and distribute any content in any way and anywhere you like, without giving credit or attribution.</p>
      </footer>
    </div>

    <script>
      (function () {
        // Theme switcher
        const themeBtn = document.getElementById('theme-toggle');
        if (themeBtn) {
          themeBtn.addEventListener('click', function () {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
          });
        }

        // Compact search toggle & live search
        const searchToggle = document.getElementById('search-toggle');
        const headerSearch = document.getElementById('header-search');
        const input = document.getElementById('search-input');
        const clearBtn = document.getElementById('search-clear');
        const dropdown = document.getElementById('search-dropdown');
        const feedList = document.getElementById('feed-list');
        const originalFeedHtml = feedList ? feedList.innerHTML : null;
        let indexData = null;

        if (!searchToggle || !headerSearch || !input) return;

        function escapeHtml(str) {
          const div = document.createElement('div');
          div.textContent = str || '';
          return div.innerHTML;
        }

        async function getIndex() {
          if (indexData) return indexData;
          const res = await fetch("{{ '/search.json' | relative_url }}?v={{ site.time | date: '%s' }}");
          if (!res.ok) throw new Error('HTTP ' + res.status);
          indexData = await res.json();
          return indexData;
        }

        function resetSearch() {
          dropdown.hidden = true;
          dropdown.innerHTML = '';
          if (feedList && originalFeedHtml !== null) {
            feedList.innerHTML = originalFeedHtml;
          }
        }

        function openSearch() {
          headerSearch.hidden = false;
          input.focus();
          getIndex().catch(function () {});
        }

        function closeSearch() {
          input.value = '';
          clearBtn.hidden = true;
          resetSearch();
          headerSearch.hidden = true;
        }

        searchToggle.addEventListener('click', function () {
          if (headerSearch.hidden) {
            openSearch();
          } else {
            closeSearch();
          }
        });

        input.addEventListener('input', async function () {
          const rawQuery = input.value.trim();
          const q = rawQuery.toLowerCase();
          clearBtn.hidden = q.length === 0;

          if (!q) {
            resetSearch();
            return;
          }

          try {
            const posts = await getIndex();
            const filtered = posts.filter(function (post) {
              const inTitle = (post.title || '').toLowerCase().indexOf(q) !== -1;
              const inContent = (post.content || '').toLowerCase().indexOf(q) !== -1;
              const inTags = (post.tags || []).some(function (t) {
                return String(t).toLowerCase().indexOf(q.replace(/^#/, '')) !== -1;
              });
              return inTitle || inContent || inTags;
            });

            if (feedList) {
              dropdown.hidden = true;
              if (!filtered.length) {
                feedList.innerHTML = '<li class="feed-card"><p class="feed-excerpt">No posts found for "' + escapeHtml(rawQuery) + '"</p></li>';
                return;
              }
              feedList.innerHTML = filtered.map(function (post) {
                let tagsHtml = '';
                if (post.tags && post.tags.length) {
                  tagsHtml = '<div class="post-tags">' + post.tags.map(function (t) {
                    return '<span class="tag-pill">#' + escapeHtml(t) + '</span>';
                  }).join('') + '</div>';
                }
                return (
                  '<li class="feed-card">' +
                    '<time class="feed-date">' + escapeHtml(post.date) + '</time>' +
                    '<h2 class="feed-title"><a href="' + escapeHtml(post.url) + '">' + escapeHtml(post.title) + '</a></h2>' +
                    (post.excerpt ? '<p class="feed-excerpt">' + escapeHtml(post.excerpt) + '</p>' : '') +
                    tagsHtml +
                  '</li>'
                );
              }).join('');
            } else {
              dropdown.hidden = false;
              if (!filtered.length) {
                dropdown.innerHTML = '<div class="search-empty">No posts found for "' + escapeHtml(rawQuery) + '"</div>';
                return;
              }
              dropdown.innerHTML = filtered.slice(0, 8).map(function (post) {
                return (
                  '<a class="search-dropdown-item" href="' + escapeHtml(post.url) + '">' +
                    '<span class="search-dropdown-title">' + escapeHtml(post.title) + '</span>' +
                    '<span class="search-dropdown-date">' + escapeHtml(post.date) + '</span>' +
                  '</a>'
                );
              }).join('');
            }
          } catch (e) {
            dropdown.hidden = false;
            dropdown.innerHTML = '<div class="search-empty">Search index unavailable. Make sure search.json exists.</div>';
          }
        });

        clearBtn.addEventListener('click', function () {
          input.value = '';
          clearBtn.hidden = true;
          resetSearch();
          input.focus();
        });

        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && !headerSearch.hidden) {
            closeSearch();
          }
        });
      })();
    </script>
  </body>
</html>
